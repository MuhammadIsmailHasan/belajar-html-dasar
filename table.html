<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <table style="border: 1px solid black;">
        <colgroup>
            <col span="2" style="background-color: lightblue;">
            <col style="background-color: lightgreen;">
        </colgroup>
        <thead>
            <tr>
                <th colspan="3">Ini table</th>
            </tr>
            <tr>
                <th>Nama</th>
                <th>Usia</th>
                <th>Alamat</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Ismail</td>
                <td>20</td>
                <td>Jakarta</td>
            </tr>
            <tr>
                <td>Ahmad</td>
                <td>25</td>
                <td>Bandung</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3">Ini footer</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
