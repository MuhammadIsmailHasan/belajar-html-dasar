<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic HTML</title>

    <style>
        header {
            background-color: grey;
            padding: 30px;
            text-align: center;
            font-size: 35px;
            color: white;
        }

        article {
            padding: 20px;
            width: 100%;
            background-color: #f1f1f1;
        }

        footer {
            background-color: grey;
            padding: 10px;
            text-align: center;
            color: white;
        }

        nav {
            background-color: yellow;
            padding: 10px;
        }

        nav ul {
            list-style-type: none;
            overflow: hidden;
        }

        nav li {
            float: left;
        }

        nav li a {
            display: block;
            text-align: center;
            padding: 16px;
            text-decoration: none;
        }

        nav li a:hover {
            background-color: orange;
        }


    </style>

</head>
<body>
    <header>
        <h1>Belajar Semantic HTML</h1>
    </header>
    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
    <section>
        <article>
            <h2>Belajar memahami rizka</h2>
            <p>Ini adalah artikel tentang memahami rizka.</p>
        </article>
        <article>
            <h2>Kalau tidak sekarang kapan lagi</h2>
            <p>Ini adalah artikel tentang pentingnya bertindak sekarang.</p>
        </article>
    </section>
    <footer>
        <p>&copy;
            <time datetime="2026">
                2026
            </time>
            . Belajar Semantic HTML
        </p>
    </footer>
</body>
</html>
